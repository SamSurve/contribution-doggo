name: Generate Contribution Doggo

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"
  push:
    branches: [main]
    paths:
      - "doggo.py"
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/generate-doggo.yml"

permissions:
  contents: write

concurrency:
  group: contribution-doggo
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: pytest tests

      - name: Generate animation from contribution calendar
        env:
          DOGGO_TOKEN: ${{ secrets.DOGGO_TOKEN }}
          GH_TOKEN: ${{ secrets.DOGGO_TOKEN }}
          GITHUB_USERNAME: SamSurve
        run: python doggo.py

      - name: Publish generated GIF
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: dist
          force_orphan: true
