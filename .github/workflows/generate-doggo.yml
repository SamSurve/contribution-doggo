name: Generate Contribution Doggo

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"
  push:
    branches: [main, "integration/**"]
    paths:
      - "doggo.py"
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/generate-doggo.yml"

permissions:
  contents: write

concurrency:
  group: contribution-doggo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest tests

      - name: Restore previous contribution snapshot
        continue-on-error: true
        run: |
          mkdir -p data
          if git show origin/output:contributions_snapshot.json > data/contributions_snapshot.json 2>/dev/null; then
            echo "[SNAPSHOT] Successfully restored previous snapshot from origin/output branch."
          else
            rm -f data/contributions_snapshot.json
            echo "[SNAPSHOT] No previous snapshot found on origin/output branch; using initial baseline."
          fi

      - name: Generate animation from contribution calendar
        env:
          DOGGO_TOKEN: ${{ secrets.DOGGO_TOKEN }}
          GH_TOKEN: ${{ secrets.DOGGO_TOKEN }}
          GITHUB_USERNAME: SamSurve
        run: python doggo.py

      - name: Publish generated GIF
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: dist
          force_orphan: true
